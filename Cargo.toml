[workspace]
members = ["src-tauri"]
resolver = "3"

[workspace.package]
version = "0.2.0"
description = "A 3D visualization editor for GDS layouts."
repository = "https://github.com/KercyDing/gds3d"
authors = ["AWGForge"]
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
