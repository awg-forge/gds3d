[package]
name = "gds3d"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
crc32fast = "1.5"
gdsii = "0.3"
indexmap = { version = "2", features = ["serde"] }
base64 = "0.23"
crypto_box = "0.9"
fontdb = "0.24"
flate2 = "1"
iroh = { version = "1", features = ["unstable-net-report"] }
log = "0.4"
md5 = "0.8"
keyring = "4"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
sculk = { version = "0.6", features = ["persist"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }
