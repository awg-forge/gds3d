name: "正式发布"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  validate-tag:
    name: 校验 Tag 来源并提取版本
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_body: ${{ steps.meta.outputs.release_body }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验 Tag 指向 main 分支提交
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "当前 tag (${GITHUB_REF_NAME}) 对应提交不在 main 分支上"
            exit 1
          fi

      - name: 校验主检查已通过
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = process.env.GITHUB_SHA;
            const requiredWorkflowName = '代码质量检查';

            const attempts = 80;
            const intervalMs = 15_000;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: headSha,
                event: 'push',
                per_page: 20,
              });
              const runs = response.data.workflow_runs.filter((run) =>
                run.name === requiredWorkflowName &&
                run.head_sha === headSha &&
                run.head_branch === 'main'
              );

              if (runs.some((run) => run.status === 'completed' && run.conclusion === 'success')) {
                core.info(`提交 ${headSha} 已通过 ${requiredWorkflowName}`);
                return;
              }

              const running = runs.some((run) => run.status !== 'completed');
              if (runs.length > 0 && !running) {
                const conclusions = runs.map((run) => run.conclusion ?? 'unknown').join(', ');
                core.setFailed(`${requiredWorkflowName} 未通过，结果：${conclusions}`);
                return;
              }

              core.info(
                `等待 ${requiredWorkflowName}（${attempt}/${attempts}，状态：${running ? '运行中' : '尚未启动'}）`
              );
              await new Promise((resolve) => setTimeout(resolve, intervalMs));
            }

            core.setFailed(`等待 ${requiredWorkflowName} 超时`);

      - name: 提取版本信息
        id: meta
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "当前 tag 不符合 vX.Y.Z 版本格式: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          PRERELEASE=false
          if echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            PRERELEASE=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_name=gds3d v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_body<<EOF" >> "$GITHUB_OUTPUT"
          echo "## 安装" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "| 系统 | 架构 | 下载 |" >> "$GITHUB_OUTPUT"
          echo "| --- | --- | --- |" >> "$GITHUB_OUTPUT"
          echo "| Windows | x86_64 | [安装程序（.exe）](${RELEASE_BASE}/gds3d_${VERSION}_x64-setup.exe) |" >> "$GITHUB_OUTPUT"
          echo "| Windows | ARM64 | [安装程序（.exe）](${RELEASE_BASE}/gds3d_${VERSION}_arm64-setup.exe) |" >> "$GITHUB_OUTPUT"
          echo "| macOS | Intel | [磁盘映像（.dmg）](${RELEASE_BASE}/gds3d_${VERSION}_x64.dmg) |" >> "$GITHUB_OUTPUT"
          echo "| macOS | Apple Silicon | [磁盘映像（.dmg）](${RELEASE_BASE}/gds3d_${VERSION}_aarch64.dmg) |" >> "$GITHUB_OUTPUT"
          echo "| Linux | x86_64 | [软件包（.deb）](${RELEASE_BASE}/gds3d_${VERSION}_amd64.deb) / [软件包（.rpm）](${RELEASE_BASE}/gds3d-${VERSION}-1.x86_64.rpm) |" >> "$GITHUB_OUTPUT"
          echo "| Linux | ARM64 | [软件包（.deb）](${RELEASE_BASE}/gds3d_${VERSION}_arm64.deb) / [软件包（.rpm）](${RELEASE_BASE}/gds3d-${VERSION}-1.aarch64.rpm) |" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Windows" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "下载对应架构的安装程序，运行后按照安装向导完成安装。大多数 Windows 电脑使用 \`x86_64\`；搭载 ARM 处理器的设备使用 ARM64 版本。" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### macOS" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "打开 \`.dmg\` 文件后，将 \`gds3d.app\` 拖入 \`Applications\` 文件夹。" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "当前发布的应用未进行 Apple 签名和公证。如果 macOS 提示应用已损坏，可在终端执行：" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo '```sh' >> "$GITHUB_OUTPUT"
          echo 'xattr -dr com.apple.quarantine "/Applications/gds3d.app"' >> "$GITHUB_OUTPUT"
          echo '```' >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "若仍被拦截，可前往“系统设置 → 隐私与安全性”选择“仍要打开”，或右键应用后选择“打开”。" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Linux" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "可直接安装对应发行版的 \`.deb\` 或 \`.rpm\` 软件包。" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 创建发布草稿
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          RELEASE_BODY: ${{ steps.meta.outputs.release_body }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const existing = releases.find((release) =>
              release.draft && release.tag_name === tag
            );

            if (existing) {
              core.info(`发布草稿 ${tag} 已存在（${existing.id}）`);
              return;
            }

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: process.env.RELEASE_NAME,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: process.env.RELEASE_PRERELEASE === 'true',
            });
            core.info(`已创建发布草稿 ${tag}（${release.data.id}）`);

  publish-tauri:
    name: 构建 ${{ matrix.label }}
    needs: validate-tag
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - label: macOS x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - label: Linux x64
            platform: ubuntu-22.04
            args: ""
          - label: Linux ARM64
            platform: ubuntu-22.04-arm
            args: ""
          - label: Windows x64
            platform: windows-latest
            args: ""
          - label: Windows ARM64
            platform: windows-11-arm
            args: ""
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装系统依赖 (Ubuntu 专用)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils nasm

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 安装 pnpm
        run: corepack enable

      - name: 安装 Rust 工具链 (默认目标)
        if: matrix.args == ''
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Rust 工具链 (macOS 目标)
        if: matrix.args != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 运行前端检查
        run: pnpm test

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          tagName: ${{ needs.validate-tag.outputs.tag }}
          releaseName: ${{ needs.validate-tag.outputs.release_name }}
          releaseBody: ${{ needs.validate-tag.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          args: ${{ matrix.args }}

      - name: 修正 macOS DMG 布局
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$(find target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          if [[ -z "${dmg_path}" ]]; then
            echo "未找到 macOS DMG 产物" >&2
            exit 1
          fi

          bash scripts/makedmg.sh "${dmg_path}"
          gh release upload "${RELEASE_TAG}" "${dmg_path}" --clobber
