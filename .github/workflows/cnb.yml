name: 同步到 CNB

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的发布标签（例如：v1.0.1）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-to-cnb
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: 设置 Go 环境
        if: github.event_name != 'push'
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"

      - name: 克隆 release-sync
        if: github.event_name != 'push'
        run: git clone --depth 1 https://github.com/SeaLantern-Studio/release-sync.git

      - name: 下载依赖
        if: github.event_name != 'push'
        working-directory: release-sync
        run: go mod download

      - name: 强制镜像分支并补齐缺失标签
        shell: bash
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${SOURCE_GITHUB_TOKEN}" ]]; then
            echo "缺少 GitHub Actions Secret: SOURCE_GITHUB_TOKEN" >&2
            exit 1
          fi
          if [[ -z "${CNB_TOKEN}" ]]; then
            echo "缺少 GitHub Actions Secret: CNB_TOKEN" >&2
            exit 1
          fi

          echo "::add-mask::${SOURCE_GITHUB_TOKEN}"
          echo "::add-mask::${CNB_TOKEN}"

          SOURCE_URL="https://x-access-token:${SOURCE_GITHUB_TOKEN}@github.com/SeaLantern-Studio/SeaLantern-Connect.git"
          TARGET_URL="https://cnb:${CNB_TOKEN}@cnb.cool/SeaLantern-studio/SeaLantern-Connect"
          MIRROR_DIR="$(mktemp -d)"
          trap 'rm -rf "$MIRROR_DIR"' EXIT

          git clone --mirror "$SOURCE_URL" "$MIRROR_DIR/repository.git"

          # 不使用 --prune，保留 CNB 的 updater 孤儿分支。
          git -C "$MIRROR_DIR/repository.git" push \
            --force \
            "$TARGET_URL" \
            'refs/heads/*:refs/heads/*'

          # 不改写或删除 CNB 已有标签。
          while IFS= read -r tag; do
            if git ls-remote --exit-code --tags "$TARGET_URL" "refs/tags/$tag" >/dev/null 2>&1; then
              echo "保留 CNB 已有标签: $tag"
            else
              git -C "$MIRROR_DIR/repository.git" push \
                "$TARGET_URL" \
                "refs/tags/$tag:refs/tags/$tag"
            fi
          done < <(git -C "$MIRROR_DIR/repository.git" tag --list)

      - name: 同步最新发布（release 事件）
        if: github.event_name == 'release'
        working-directory: release-sync
        env:
          PLUGIN_SOURCE_URL: https://github.com
          PLUGIN_SOURCE_PLATFORM: github
          PLUGIN_SOURCE_REPO: SeaLantern-Studio/SeaLantern-Connect
          PLUGIN_CNB_ROOT_ORGANIZATION: SeaLantern-studio
          PLUGIN_MIGRATE_ORGANIZATION_MAPPING_LEVEL: "2"
          PLUGIN_MIGRATE_CODE: "false"
          PLUGIN_MIGRATE_RELEASE: "true"
          PLUGIN_CNB_URL: https://cnb.cool
          PLUGIN_SOURCE_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          PLUGIN_CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: go run .

      - name: 同步指定标签（手动触发）
        if: github.event_name == 'workflow_dispatch'
        working-directory: release-sync
        env:
          PLUGIN_SOURCE_URL: https://github.com
          PLUGIN_SOURCE_PLATFORM: github
          PLUGIN_SOURCE_REPO: SeaLantern-Studio/SeaLantern-Connect
          PLUGIN_CNB_ROOT_ORGANIZATION: SeaLantern-studio
          PLUGIN_MIGRATE_ORGANIZATION_MAPPING_LEVEL: "2"
          PLUGIN_MIGRATE_CODE: "false"
          PLUGIN_MIGRATE_RELEASE: "true"
          PLUGIN_MIGRATE_RELEASE_TAG: ${{ inputs.tag }}
          PLUGIN_CNB_URL: https://cnb.cool
          PLUGIN_SOURCE_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          PLUGIN_CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: go run .

      - name: 发布 CNB 更新清单
        if: github.event_name != 'push'
        shell: bash
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -z "${SOURCE_GITHUB_TOKEN}" || -z "${CNB_TOKEN}" || -z "${RELEASE_TAG}" ]]; then
            echo "缺少发布更新清单所需的 Secret 或标签" >&2
            exit 1
          fi

          echo "::add-mask::${SOURCE_GITHUB_TOKEN}"
          echo "::add-mask::${CNB_TOKEN}"

          manifest_url="https://github.com/SeaLantern-Studio/SeaLantern-Connect/releases/download/${RELEASE_TAG}/latest.json"
          manifest="$(mktemp)"
          release_metadata="$(mktemp)"
          repository="$(mktemp -d)"
          trap 'rm -f "$manifest" "$release_metadata"; rm -rf "$repository"' EXIT

          curl --fail --location --retry 5 --retry-delay 3 \
            --header "Authorization: Bearer ${SOURCE_GITHUB_TOKEN}" \
            "$manifest_url" \
            --output "$manifest"

          curl --fail --location --retry 5 --retry-delay 3 \
            --header "Authorization: Bearer ${SOURCE_GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/SeaLantern-Studio/SeaLantern-Connect/releases/tags/${RELEASE_TAG}" \
            --output "$release_metadata"

          # 清单保留 Tauri 签名，把每个平台的下载 URL 改为 CNB 当前标签的资产地址。
          cnb_prefix="https://cnb.cool/SeaLantern-studio/SeaLantern-Connect/-/releases/download/${RELEASE_TAG}/"
          github_prefix="https://github.com/SeaLantern-Studio/SeaLantern-Connect/releases/download/${RELEASE_TAG}/"
          jq --arg from "$github_prefix" --arg to "$cnb_prefix" \
            --slurpfile release "$release_metadata" \
            '(.notes = "") |
            ((.platforms[] | .url) |= (
              . as $url |
              if ($url | startswith($from)) then
                $url | sub($from; $to)
              else
                (($release[0].assets[] | select(.url == $url) | .name) // error("找不到更新资产: " + $url))
                | $to + .
              end
            ))' \
            "$manifest" > "$repository/latest.json"

          target_url="https://cnb:${CNB_TOKEN}@cnb.cool/SeaLantern-studio/SeaLantern-Connect"
          git init "$repository"
          git -C "$repository" checkout --orphan updater
          git -C "$repository" config user.name "github-actions[bot]"
          git -C "$repository" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repository" add latest.json
          git -C "$repository" commit -m "chore: update manifest for ${RELEASE_TAG}"
          git -C "$repository" push --force "$target_url" updater
