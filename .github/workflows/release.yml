name: "Release"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  validate-tag:
    name: Validate tag and extract version
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_body: ${{ steps.meta.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag points to main
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          fi

      - name: Verify required checks
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = process.env.GITHUB_SHA;
            const requiredWorkflowName = 'Code Quality';

            const attempts = 80;
            const intervalMs = 15_000;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: headSha,
                event: 'push',
                per_page: 20,
              });
              const runs = response.data.workflow_runs.filter((run) =>
                run.name === requiredWorkflowName &&
                run.head_sha === headSha &&
                run.head_branch === 'main'
              );

              if (runs.some((run) => run.status === 'completed' && run.conclusion === 'success')) {
                core.info(`Commit ${headSha} passed ${requiredWorkflowName}`);
                return;
              }

              const running = runs.some((run) => run.status !== 'completed');
              if (runs.length > 0 && !running) {
                const conclusions = runs.map((run) => run.conclusion ?? 'unknown').join(', ');
                core.setFailed(`${requiredWorkflowName} failed: ${conclusions}`);
                return;
              }

              core.info(
                `Waiting for ${requiredWorkflowName} (${attempt}/${attempts}, status: ${running ? 'running' : 'not started'})`
              );
              await new Promise((resolve) => setTimeout(resolve, intervalMs));
            }

            core.setFailed(`Timed out waiting for ${requiredWorkflowName}`);

      - name: Extract version metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Tag does not match the vX.Y.Z format: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          PRERELEASE=false
          if echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            PRERELEASE=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_name=gds3d v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_body<<EOF" >> "$GITHUB_OUTPUT"
          echo "## Installation" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "| Platform | Architecture | Download |" >> "$GITHUB_OUTPUT"
          echo "| --- | --- | --- |" >> "$GITHUB_OUTPUT"
          echo "| Windows | x86_64 | [Installer (.exe)](${RELEASE_BASE}/gds3d_${VERSION}_x64-setup.exe) |" >> "$GITHUB_OUTPUT"
          echo "| Windows | ARM64 | [Installer (.exe)](${RELEASE_BASE}/gds3d_${VERSION}_arm64-setup.exe) |" >> "$GITHUB_OUTPUT"
          echo "| macOS | Intel | [Disk image (.dmg)](${RELEASE_BASE}/gds3d_${VERSION}_x64.dmg) |" >> "$GITHUB_OUTPUT"
          echo "| macOS | Apple Silicon | [Disk image (.dmg)](${RELEASE_BASE}/gds3d_${VERSION}_aarch64.dmg) |" >> "$GITHUB_OUTPUT"
          echo "| Linux | x86_64 | [Package (.deb)](${RELEASE_BASE}/gds3d_${VERSION}_amd64.deb) / [Package (.rpm)](${RELEASE_BASE}/gds3d-${VERSION}-1.x86_64.rpm) |" >> "$GITHUB_OUTPUT"
          echo "| Linux | ARM64 | [Package (.deb)](${RELEASE_BASE}/gds3d_${VERSION}_arm64.deb) / [Package (.rpm)](${RELEASE_BASE}/gds3d-${VERSION}-1.aarch64.rpm) |" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Windows" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Download the installer for your architecture and follow the installation wizard. Most Windows PCs use \`x86_64\`; ARM-based devices use ARM64." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### macOS" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Open the \`.dmg\` file and drag \`gds3d.app\` to the \`Applications\` folder." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "This release is not signed or notarized by Apple. If macOS reports that the app is damaged, run:" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo '```sh' >> "$GITHUB_OUTPUT"
          echo 'xattr -dr com.apple.quarantine "/Applications/gds3d.app"' >> "$GITHUB_OUTPUT"
          echo '```' >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "If it is still blocked, open System Settings > Privacy & Security and choose Open Anyway, or right-click the app and choose Open." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Linux" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Install the \`.deb\` or \`.rpm\` package for your distribution." >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release draft
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          RELEASE_BODY: ${{ steps.meta.outputs.release_body }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const existing = releases.find((release) =>
              release.draft && release.tag_name === tag
            );

            if (existing) {
              core.info(`Release draft ${tag} already exists (${existing.id})`);
              return;
            }

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: process.env.RELEASE_NAME,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: process.env.RELEASE_PRERELEASE === 'true',
            });
            core.info(`Created release draft ${tag} (${release.data.id})`);

  publish-tauri:
    name: Build ${{ matrix.label }}
    needs: validate-tag
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - label: macOS x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - label: Linux x64
            platform: ubuntu-22.04
            args: ""
          - label: Linux ARM64
            platform: ubuntu-22.04-arm
            args: ""
          - label: Windows x64
            platform: windows-latest
            args: ""
          - label: Windows ARM64
            platform: windows-11-arm
            args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils nasm

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        run: corepack enable

      - name: Install Rust toolchain (default target)
        if: matrix.args == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust toolchain (macOS targets)
        if: matrix.args != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: pnpm test

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          tagName: ${{ needs.validate-tag.outputs.tag }}
          releaseName: ${{ needs.validate-tag.outputs.release_name }}
          releaseBody: ${{ needs.validate-tag.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          args: ${{ matrix.args }}

      - name: Fix macOS DMG layout
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$(find target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          if [[ -z "${dmg_path}" ]]; then
            echo "macOS DMG artifact not found" >&2
            exit 1
          fi

          bash scripts/makedmg.sh "${dmg_path}"
          gh release upload "${RELEASE_TAG}" "${dmg_path}" --clobber
